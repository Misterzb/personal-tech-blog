server:
  port: 8080

spring:
  application:
    name: blog-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  profiles:
    active: local

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

blog:
  jwt:
    secret: ${JWT_SECRET:BlogJwtSecretKeyForPersonalTechBlog2024MustBeLongEnough}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    url-prefix: /uploads
  site:
    base-url: ${SITE_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5173
      - http://127.0.0.1:5174

logging:
  level:
    com.blog: info
    com.blog.mapper: warn
