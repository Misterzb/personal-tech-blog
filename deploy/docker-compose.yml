services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: blog
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: blog
      DB_USER: root
      DB_PASSWORD: root123
      JWT_SECRET: BlogJwtSecretKeyForPersonalTechBlog2024MustBeLongEnough
      UPLOAD_DIR: /app/uploads
      SITE_BASE_URL: https://your-domain.com
    volumes:
      - upload_data:/app/uploads
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: blog-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html/frontend:ro
      - ../admin/dist:/usr/share/nginx/html/admin:ro
      - upload_data:/usr/share/nginx/html/uploads:ro
      # - ./certs:/etc/nginx/certs:ro

volumes:
  mysql_data:
  upload_data:
