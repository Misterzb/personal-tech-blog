services:
  # 仅本机开发需要时启用：docker compose --profile local-db --env-file .env.local up -d mysql redis
  mysql:
    profiles: ["local-db"]
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-local_mysql_dev_only}
      MYSQL_DATABASE: blog
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --ngram_token_size=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${SPRING_DATASOURCE_PASSWORD:-local_mysql_dev_only}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["local-db"]
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-local_redis_dev_only}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local_redis_dev_only}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-10}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BLOG_RESPONSE_AES_KEY: ${BLOG_RESPONSE_AES_KEY}
      SITE_BASE_URL: ${SITE_BASE_URL:-https://bo.bj.cn}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://bo.bj.cn}
      SITE_ORIGIN_WWW: ${SITE_ORIGIN_WWW:-https://www.bo.bj.cn}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    volumes:
      - upload_data:/app/uploads
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: blog-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html/frontend:ro
      - ../admin/dist:/usr/share/nginx/html/admin:ro
      - upload_data:/usr/share/nginx/html/uploads:ro
      # - ./certs:/etc/nginx/certs:ro

volumes:
  mysql_data:
  redis_data:
  upload_data:
