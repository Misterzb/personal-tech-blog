limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=1r/s;

server {
    listen 80;
    server_name bo.bj.cn www.bo.bj.cn;
    client_max_body_size 10m;

    # 安全响应头（HTTPS 部署时再叠加 HSTS，见 https.conf.example）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location /api/public/search {
        limit_req zone=search_limit burst=5 nodelay;
        proxy_pass http://backend:8080/api/public/search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/public/articles/search {
        limit_req zone=search_limit burst=5 nodelay;
        proxy_pass http://backend:8080/api/public/articles/search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        access_log off;
        expires 7d;
    }

    location = /rss.xml {
        proxy_pass http://backend:8080/rss.xml;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8080/sitemap.xml;
    }

    location = /robots.txt {
        proxy_pass http://backend:8080/robots.txt;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /usr/share/nginx/html/frontend;
        try_files $uri $uri/ /index.html;
    }
}
